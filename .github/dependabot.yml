# Dependency updates for the first-party servers and the workflows themselves.
#
# The vendored servers (servers/audacity, servers/obsidian, servers/blockbench)
# are deliberately absent: their dependencies are upstream's to manage, and
# bumping them here would silently break the "vendored verbatim" status that
# COPYRIGHT records. The scheduled upstream-drift workflow is what watches
# those -- pulling a new upstream release brings its dependency changes along.

version: 2

updates:
  - package-ecosystem: uv
    directory: /servers/aseprite
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Deliberate: every Python server imports mcp.server.fastmcp, which mcp
      # 2.0 removed. The <2 pin in each pyproject is load-bearing; proposing
      # the major bump (old PR #9) just re-litigates a decided break.
      - dependency-name: "mcp*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /servers/godot/server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Deliberate: fastmcp 4 is a breaking API rewrite and zod 4 breaks
      # fastmcp 1.x (old PRs #10/#11 failed the build on both platforms).
      # Upgrading is a migration project to do together, not a bump.
      # fastmcp moves its API even inside 1.x -- the 1.20 -> 1.27 bump broke
      # the build on both platforms (old PR #24). All updates ignored; upgrade
      # is one deliberate migration.
      - dependency-name: "fastmcp"
      # TypeScript 7 is a compiler rewrite; the build fails (old PR #20).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /servers/rfxgen
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Deliberate: every Python server imports mcp.server.fastmcp, which mcp
      # 2.0 removed. The <2 pin in each pyproject is load-bearing; proposing
      # the major bump (old PR #9) just re-litigates a decided break.
      - dependency-name: "mcp*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /servers/ffmpeg
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Deliberate: every Python server imports mcp.server.fastmcp, which mcp
      # 2.0 removed. The <2 pin in each pyproject is load-bearing; proposing
      # the major bump (old PR #9) just re-litigates a decided break.
      - dependency-name: "mcp*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
