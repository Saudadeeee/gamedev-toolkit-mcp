[project]
name = "rfxgen-mcp"
version = "0.1.0"
description = "MCP server for rfxgen — retro sound-effect synthesis for the game pipeline, driven through rfxgen's CLI and authored .rfx parameter files"
readme = "README.md"
# Original code, written for this toolkit; the project licence applies. rfxgen
# itself (the application this drives) is zlib-licensed and not redistributed
# here -- see COPYRIGHT.
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
keywords = ["mcp", "rfxgen", "sfx", "sound-effects", "game-dev", "sfxr"]
authors = [
    { name = "Saudade", email = "ankhanh.v09@gmail.com" },
]
dependencies = [
    # The <2 pin matters: this server imports mcp.server.fastmcp, which mcp
    # 2.0 removed. An open bound resolves to 2.x and dies at import -- the
    # exact failure the audacity server had before upstream pinned it.
    "mcp[cli]>=1.8.0,<2",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfxgen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# smoke_test drives a real rfxgen binary; collecting it in the unit run would
# turn a machine without rfxgen into a failing build.
addopts = "--ignore=tests/smoke_test.py"

[project.urls]
Repository = "https://github.com/Saudadeeee/gamedev-toolkit-mcp"
