[project]
name = "ffmpeg-mcp"
version = "0.1.0"
description = "MCP server for ffmpeg — the game pipeline's format glue: ogg music for Godot, GIF/webm capture clips, batch conversion, media inspection"
readme = "README.md"
# Original code, written for this toolkit; the project licence applies. ffmpeg
# itself is an external application (GPL/LGPL build, gyan.dev), driven through
# its CLI and not redistributed here -- see COPYRIGHT.
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
keywords = ["mcp", "ffmpeg", "audio", "video", "game-dev", "ogg", "gif"]
authors = [
    { name = "Saudade", email = "ankhanh.v09@gmail.com" },
]
dependencies = [
    # The <2 pin matters: this server imports mcp.server.fastmcp, which mcp
    # 2.0 removed. Same pin as every other Python server in this toolkit.
    "mcp[cli]>=1.28.1,<2",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffmpeg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# smoke_test drives a real ffmpeg; collecting it in the unit run would turn a
# machine without ffmpeg into a failing build.
addopts = "--ignore=tests/smoke_test.py"

[project.urls]
Repository = "https://github.com/Saudadeeee/gamedev-toolkit-mcp"
