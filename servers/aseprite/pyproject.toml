[project]
name = "aseprite-mcp"
version = "1.0.0"
description = "MCP server for Aseprite — programmatic control of pixel art creation, animation, and game asset workflows via Lua script injection"
readme = "README.md"
# Distributed as part of GameDev Toolkit MCP, which is GPL-3.0-or-later. The
# MIT grant on the upstream work this forked is not revoked -- see ../../COPYRIGHT
# and this directory's LICENSE.
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
keywords = ["mcp", "aseprite", "pixel-art", "game-dev", "automation"]
authors = [
    { name = "Saudade", email = "ankhanh.v09@gmail.com" },
]
# Upstream this fork merged; see CREDITS.md for what came from where.
maintainers = [
    { name = "Saudade", email = "ankhanh.v09@gmail.com" },
]

dependencies = [
    "mcp[cli]>=1.8.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.urls]
Repository = "https://github.com/Saudadeeee/gamedev-toolkit-mcp"
"Original Project" = "https://github.com/diivi/aseprite-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aseprite_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# These drive a real Aseprite rather than asserting on pure logic, and
# pipeline_demo does its work at import time. Collecting them in the unit run
# would turn a machine without Aseprite into a failing build.
addopts = "--ignore=tests/smoke_test.py --ignore=tests/shading_test.py --ignore=tests/pipeline_demo.py"
